name: Shared checks

on:
    workflow_call:

permissions:
    contents: read

# A newer revision replaces obsolete checks; publication has its own lock.
concurrency:
    group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.22.1
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Audit dependencies
              run: npm audit

            - name: Check formatting, lint, types, and unit tests
              run: npm run check:ci

            - name: Install Chromium headless shell
              run: npx playwright install --with-deps --only-shell chromium

            - name: Run Chromium smoke checks
              run: npm run test:browser:smoke
