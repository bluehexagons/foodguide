name: CI

permissions:
    contents: read

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

# Main pushes are checked by deploy.yml before publication.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        uses: ./.github/workflows/check.yml
        permissions:
            contents: read
