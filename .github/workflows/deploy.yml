name: Deploy

on:
    push:
        branches: [main]

    # Allow manual trigger from the Actions tab
    workflow_dispatch:

# Default to no repository token permissions; jobs opt into only what they need.
permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do not cancel in-progress runs as we want to
# allow these deployments to complete.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    # Run the same checks as CI before deploying
    check:
        uses: ./.github/workflows/check.yml
        permissions:
            contents: read

    deploy-pages:
        name: Deploy to GitHub Pages
        needs: check
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            contents: read
            pages: write
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Generate sprite assets
              run: npm run build && npm run generate-sprites

            - name: Configure GitHub Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: html

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

    notify-server:
        name: Trigger server deployment
        needs: check
        runs-on: ubuntu-latest
        permissions: {}
        # Only run if the webhook secret is configured
        if: vars.DEPLOY_WEBHOOK_URL != ''

        steps:
            - name: Send deploy webhook
              env:
                  WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}
                  WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
              run: |
                  if [[ "$WEBHOOK_URL" != https://* ]]; then
                    echo "DEPLOY_WEBHOOK_URL must use HTTPS" >&2
                    exit 1
                  fi
                  if [[ -z "$WEBHOOK_SECRET" ]]; then
                    echo "DEPLOY_WEBHOOK_SECRET is not configured" >&2
                    exit 1
                  fi
                  curl -fsS -X POST "$WEBHOOK_URL" \
                    -H "Content-Type: application/json" \
                    -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
                    -d "{\"ref\": \"$GITHUB_REF\", \"sha\": \"$GITHUB_SHA\"}" \
                    --max-time 30
